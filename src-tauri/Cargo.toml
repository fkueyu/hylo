[package]
name = "tauri-app"
version = "0.1.21"
description = "Hylo — real-time HTML editor with bi-directional source/preview syncing"
authors = ["Hylo contributors"]
license = "MIT"
repository = "https://github.com/fkueyu/hylo"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# 2.3.x 兼容当前 tauri 2.11；2.4+ 要求 tauri ^2.12
tauri-plugin-clipboard-manager = "=2.3.3"
# 2.4.x 兼容当前 tauri 2.11；2.5+ 要求 tauri ^2.12
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-persisted-scope = { version = "2.3.7", features = ["protocol-asset"] }
tempfile = "3.27.0"
base64 = "0.22"

[features]
default = []
appstore = []
